<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title"><title id="title">单曲下载与打包下载的示意图</title><rect width="720" height="240" rx="14" fill="#f0fcf7"/><g font-family="sans-serif" text-anchor="middle"><rect x="40" y="34" width="290" height="172" rx="12" fill="white" stroke="#dfe5e9"/><rect x="390" y="34" width="290" height="172" rx="12" fill="white" stroke="#dfe5e9"/><text x="185" y="76" font-size="20" fill="#314d45">保存一个结果</text><text x="535" y="76" font-size="20" fill="#314d45">保存多个结果</text><rect x="112" y="96" width="146" height="52" rx="8" fill="#08a77b"/><rect x="452" y="96" width="166" height="52" rx="8" fill="#08a77b"/><text x="185" y="130" font-size="20" fill="white">↓ 下载</text><text x="535" y="130" font-size="20" fill="white">↓ 打包下载</text><text x="185" y="182" font-size="16" fill="#5b7469">按实际音频格式保存</text><text x="535" y="182" font-size="16" fill="#5b7469">御用音乐包.zip</text></g></svg>
